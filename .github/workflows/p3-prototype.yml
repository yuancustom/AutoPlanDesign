name: P3 canvas-first prototype (no model)
on:
  push:
    paths:
      - 'projects/plan-delivery/prototype/**'
      - '.github/workflows/p3-prototype.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install playwright==1.57.0 'Pillow>=11,<13'
      - run: python -m playwright install --with-deps chromium
      - name: JavaScript syntax
        run: for f in projects/plan-delivery/prototype/*.js; do node --check "$f"; done
      - name: Build standalone HTML
        run: python projects/plan-delivery/prototype/build_standalone.py --out runs/p3-prototype/P3_canvas_v3.html
      - name: Original interaction regression
        run: python projects/plan-delivery/prototype/qa/test_ui.py --html runs/p3-prototype/P3_canvas_v3.html --out runs/p3-prototype/interaction
      - name: Directory and standalone loading, reload persistence
        run: python projects/plan-delivery/prototype/qa/smoke_test.py --standalone runs/p3-prototype/P3_canvas_v3.html --out runs/p3-prototype/loading
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: p3-canvas-first-prototype
          path: runs/p3-prototype/
