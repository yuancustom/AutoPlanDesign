name: Three-project governance and baseline checks (no model inference)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  governance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements-dev.txt
      - run: python tools/check_governance.py
      - run: python -m pytest tests -q
  independent-scaffolds:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        project: [outline-plan, region-edit, plan-delivery]
    defaults:
      run:
        working-directory: projects/${{ matrix.project }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e .
      - run: python -m unittest discover -s tests -v
  p1-frozen-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: projects/outline-plan/baseline
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - run: python scripts/run_pilot.py --mode dry-run --job examples/l_shape_job.json --out runs/governance-baseline
      - uses: actions/upload-artifact@v4
        with:
          name: frozen-p1-geometry-not-model-output
          path: projects/outline-plan/baseline/runs/governance-baseline/
          retention-days: 14
  # P3 original validator suite NOT_RUN: three original files are blocked from import.
  # The governance job checks the partial-import manifest; scaffold CI is not Skill acceptance.
