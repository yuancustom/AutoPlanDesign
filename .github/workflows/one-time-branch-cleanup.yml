name: One-time reviewed branch cleanup

on:
  push:
    branches: [main]
    paths: ['.github/workflows/one-time-branch-cleanup.yml']

permissions:
  contents: write

jobs:
  cleanup:
    if: github.repository == 'yuancustom/AutoPlanDesign' && github.event.head_commit.message == 'chore: remove reviewed non-main branches'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify exact heads, delete only reviewed branches, preserve main
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os, urllib.request, urllib.error, urllib.parse
          base = 'https://api.github.com/repos/yuancustom/AutoPlanDesign'
          expected = {
              'feat/l-shape-pilot': '3bcd6bcee80c69d8e978c9748788be83152ec452',
              'test/github-write-check-20260910': 'ae12c37111467eda7c922a59284ebdcbb705df97',
          }
          def api(path, method='GET', missing_ok=False):
              req = urllib.request.Request(base + path, method=method, headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'X-GitHub-Api-Version': '2022-11-28',
                  'User-Agent': 'AutoPlanDesign-reviewed-cleanup',
              })
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      raw = response.read()
                      return json.loads(raw) if raw else None
              except urllib.error.HTTPError as error:
                  if missing_ok and error.code == 404:
                      return None
                  raise RuntimeError(f'{method} {path}: HTTP {error.code}') from None
          repo = api('')
          if repo['id'] != 1363609437 or repo['default_branch'] != 'main':
              raise RuntimeError('Repository/default branch changed; refusing cleanup')
          pending = []
          for branch, sha in expected.items():
              assert branch != 'main'
              ref = api('/git/ref/heads/' + urllib.parse.quote(branch, safe='/'), missing_ok=True)
              if ref is None:
                  print('Already absent:', branch)
                  continue
              if ref['object']['sha'] != sha:
                  raise RuntimeError('Branch changed after review: ' + branch)
              pending.append(branch)
          # All targets have been checked before the first deletion.
          for branch in pending:
              ref_path = '/git/ref/heads/' + urllib.parse.quote(branch, safe='/')
              current = api(ref_path)
              if current['object']['sha'] != expected[branch]:
                  raise RuntimeError('Branch changed before deletion: ' + branch)
              api('/git/refs/heads/' + urllib.parse.quote(branch, safe='/'), 'DELETE')
              if api(ref_path, missing_ok=True) is not None:
                  raise RuntimeError('Deletion not confirmed: ' + branch)
              print('Deleted:', branch, 'previous head:', expected[branch])
          main = api('/git/ref/heads/main')
          print('Preserved main:', main['object']['sha'])
          branches = api('/branches?per_page=100')
          names = [item['name'] for item in branches]
          print('Remaining branches:', json.dumps(names))
          if names != ['main']:
              raise RuntimeError('Unexpected remaining branches; no further branches deleted')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as f:
              f.write('## Branch cleanup verified\n\nOnly `main` remains.\n')
              for branch, sha in expected.items():
                  f.write(f'- Removed `{branch}`; reviewed head `{sha}`.\n')
          PY
