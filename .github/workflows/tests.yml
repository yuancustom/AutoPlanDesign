name: Geometry and protocol tests (no model inference)
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - name: Install runtime dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk
          python -m pip install -r requirements.txt
      - name: Unit and regression tests
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p runs/ci-evidence
          python -m pytest -q --color=no --junitxml=runs/ci-evidence/pytest.xml | tee runs/ci-evidence/pytest.txt
      - name: L-shaped three-floor geometry and API dry-run only
        run: python scripts/run_pilot.py --mode dry-run --job examples/l_shape_job.json --out runs/ci-l-shape
      - name: Save geometry preview and protocol evidence (not model output)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: l-shape-geometry-and-protocol
          path: |
            runs/ci-evidence/
            runs/ci-l-shape/
          if-no-files-found: warn
          retention-days: 14
