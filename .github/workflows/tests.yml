name: Geometry and protocol tests (no model inference)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  geometry:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: sudo apt-get update && sudo apt-get install -y fonts-noto-cjk
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest -q
      - name: Geometry-only pilot and API dry-run
        run: python scripts/run_pilot.py --mode dry-run --out runs/ci-l-shape
