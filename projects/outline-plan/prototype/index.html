function tracePage(){return title('04 / DECISIONS & EVENTS','让每一步设计都有依据','实际前端检查与模拟后端步骤分开显示。不展示隐藏思维链，也不假装已调用模型。')+`<div class="split"><section class="card"><div class="card-header"><h2>设计依据与执行记录</h2><span class="pill amber">体验流程</span></div><div class="timeline">${state.events.map(e=>`<article class="event"><div class="event-head"><h3>${esc(e.title)}</h3><span class="tag">${e.kind}</span></div><p>${esc(e.text)}</p></article>`).join('')}</div><div class="sep"></div><button data-action="traceNext">＋ 展开下一条设计流程示例</button><p class="small muted">手动展开便于理解真实产品的检查关卡；没有模拟采样百分比或耗时。</p></section><aside><section class="card"><h3>锁定的体验快照</h3><div class="code">${state.snapshot?esc(state.snapshot.id):'未创建'}<br>model_execution: false<br>approval: none</div><div class="stat-row"><span>已选模型</span><span>${state.models.length} 组（未连接）</span></div><div class="stat-row"><span>空间求解</span><span class="muted">未执行</span></div><div class="stat-row"><span>图面生成</span><span class="muted">未执行</span></div><div class="stat-row"><span>工程审查</span><span class="muted">未检查</span></div><div class="help">正式版会显示：规则来源、候选取舍、约束冲突、中间图与失败原因。</div></section></aside></div>`;}
function planSVG(f){const names=[['机房 A','机房 B','运行办公','值班室'],['资料室','控制室','通信机房','技术办公'],['资料室','综合办公','会议室','设备支持']][f-1];let rooms=[[0,0,5,5,'楼梯 A','stairs'],[5,0,5,5,'卫生间','service'],[0,5,7,7,names[0],'equipment'],[7,5,3,7,'','corridor'],[0,12,30,3,'公共走廊','corridor'],[0,15,10,9,names[1],'equipment'],[10,15,8,9,names[2],'office'],[18,15,6,9,names[3],'office'],[24,15,6,9,'楼梯 B','stairs']];return `<svg viewBox="-1 -1 32 26" aria-label="${f}层固定合成示意"><path d="M0 0H10V12H30V24H0Z" fill="white" stroke="#2d5262" stroke-width=".22"/>${rooms.map(([x,y,w,h,n,type])=>{let fill={stairs:'#e7eff7',service:'#e7f2f0',equipment:'#edf7f4',office:'#fbf1df',corridor:'#f5f7f8'}[type],symbols='';if(type==='equipment')for(let i=0;i<3;i++)symbols+=`<rect x="${x+1+i*1.6}" y="${y+1.2}" width="1.1" height="2.2" fill="none" stroke="#809b95" stroke-width=".08"/>`;if(type==='office')for(let i=0;i<2;i++)symbols+=`<rect x="${x+1+i*2}" y="${y+1.3}" width="1.4" height=".8" fill="white" stroke="#b3a68d" stroke-width=".08"/><circle cx="${x+1.7+i*2}" cy="${y+2.6}" r=".25" fill="#c5baa5"/>`;if(type==='stairs')for(let i=0;i<8;i++)symbols+=`<path d="M${x+.9},${y+.8+i*.32} h${w-1.8}" stroke="#8a9db0" stroke-width=".08"/>`;return `<rect x="${x+.08}" y="${y+.08}" width="${w-.16}" height="${h-.16}" fill="${fill}" stroke="#4b626c" stroke-width=".1"/>${symbols}<text x="${x+w/2}" y="${y+h-.8}" text-anchor="middle" font-size=".7" fill="#2d4855">${n}</text>`;}).join('')}</svg>`;}
function resultPage(){return title('05 / REVIEW WORKSPACE','先核对结果，再选择整栋方案','固定合成三层示意用于体验布局和结果页；它不是当前参数的求解结果，更不是模型生成图。','<button data-action="exportSession">导出体验记录</button>')+`<div class="screen-note">重要：以下三图始终为固定示意，不随你修改的轮廓或参数重排。真实模型候选仍为空，不能用于正式方案确认。</div><div class="comparison">${[1,2,3].map(f=>`<section class="card"><div class="card-header"><h3>${f}F · ${['设备运行','集中控制','办公支持'][f-1]}</h3><span class="pill">固定合成图</span></div>${planSVG(f)}<p class="small muted">同一 L 形边界，不同功能标签<br>没有真实尺寸或数量验收结论</p></section>`).join('')}</div><div class="split" style="margin-top:18px"><section class="card"><div class="card-header"><h3>模型结果对比</h3><span class="small muted">原图与最终图应分开核对</span></div><table><thead><tr><th>配置</th><th>真实生成</th><th>轮廓 / 数量</th><th>耗时 / 内存</th></tr></thead><tbody>${(state.models.length?state.models:['未选择']).map(n=>`<tr><td>${esc(n)}</td><td><span class="pill amber">NOT_RUN</span></td><td>未检查</td><td>未测量</td></tr>`).join('')}</tbody></table><p class="small muted">正式版可切换各层、模型原图与几何叠加，联动缩放。不用后处理后的边框证明模型保真。</p></section><aside><section class="card"><h3>方案确认交互</h3><p class="small muted">优先选择整栋候选。混合不同方案的楼层时，重新检查跨层核心与总量。</p><button data-action="favorite" class="${state.favorite?'active':'primary'}" style="width:100%;margin-top:12px">${state.favorite?'✓ 已收藏体验示意':'收藏为体验候选'}</button><button disabled style="width:100%;margin-top:8px" title="模型及审批服务未实现">确认并交给 P2（未接入）</button><p class="small muted">收藏只属于浏览器原型，不是设计批准。</p></section></aside></div>`;}
function engineeringSVG(){if(!state.confirmed){throw Error('请先确认尺度，再导出带尺寸轮廓。');}let b=C.bounds(state.points);return `<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1050" viewBox="${b.x-7} ${b.y-9} ${b.w+14} ${b.h+17}"><rect x="${b.x-7}" y="${b.y-9}" width="${b.w+14}" height="${b.h+17}" fill="white"/><text x="${b.x+b.w/2}" y="${b.y-7}" text-anchor="middle" font-size="1.15" fill="#183042">建筑外轮廓 · P1 交互原型</text>${drawingMarkup(state.points,true)}<text x="${b.x}" y="${b.y+b.h+3}" font-size=".65" fill="#526274">尺寸单位 m | 本次浏览器校准 | 无工程审查</text><text x="${b.x}" y="${b.y+b.h+4.5}" font-size=".6" fill="#526274">合成示例或用户草稿；PNG 不代表固定打印比例。无真实模型参与。</text></svg>`;}
function download(text,type,name){let url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),10000);}
function parseSVG(text){if(new TextEncoder().encode(text).length>256000)throw Error('原型输入上限 256KB');if(/<!DOCTYPE|<!ENTITY/i.test(text))throw Error('不允许 DTD 或实体声明');let doc=new DOMParser().parseFromString(text,'image/svg+xml');if(doc.querySelector('parsererror')||doc.documentElement.localName!=='svg')throw Error('SVG 格式无效');const all=[...doc.querySelectorAll('*')];if(all.length>8)throw Error('原型只接受单个简单图形');for(let e of all){if(!['svg','polygon','rect','path','title','desc'].includes(e.localName))throw Error('不支持的元素：'+e.localName);for(let a of e.attributes){if(!['xmlns','viewBox','width','height','x','y','points','d','fill','stroke','stroke-width','version','id'].includes(a.name)||/url\(|javascript:|https?:\/\//i.test(a.value)&&a.name!=='xmlns')throw Error('不支持或不安全的属性：'+a.name);}}const shapes=all.filter(e=>['polygon','rect','path'].includes(e.localName));if(shapes.length!==1)throw Error('请选择只包含一个闭合图形的 SVG');let e=shapes[0],p;const num=a=>{const s=e.getAttribute(a)||'0';if(!/^[-+]?(\d+\.?\d*|\.\d+)$/.test(s))throw Error('图形坐标必须为数字；显示单位不能代替建筑尺度');return Number(s);};if(e.localName==='path')p=C.parsePath(e.getAttribute('d')||'');else if(e.localName==='rect'){let x=num('x'),y=num('y'),w=num('width'),h=num('height');if(w<=0||h<=0)throw Error('矩形尺寸必须为正');p=[[x,y],[x+w,y],[x+w,y+h],[x,y+h]];}else{let s=e.getAttribute('points')||'';if(/[^\d\s.,+eE-]/.test(s))throw Error('非法顶点');let a=s.trim().split(/[\s,]+/).map(Number);if(a.length%2)throw Error('顶点坐标不成对');p=[];for(let i=0;i<a.length;i+=2)p.push([a[i],a[i+1]]);if(p.length>1&&p[0][0]===p.at(-1)[0]&&p[0][1]===p.at(-1)[1])p.pop();}let err=C.validatePolygon(p);if(err)throw Error(err);return p;}
const traceExamples=[['核心与交通先布置','流程示例：先比较可贯通的核心位置，再组织公共走廊。这里尚无求解器结果。'],['房间与设备容量复核','流程示例：同时检查轮廓、机柜外包和维护空间；放不下就报告冲突，不少放设备。'],['逐层模型生成','流程示例：记录真实 prompt_id、模型参数及原始图。当前模型未连接，没有运行。'],['结果分层检查与用户确认','流程示例：几何校验、图像目视、工程审查分开。当前只能查看固定示意。']];
document.addEventListener('click',async e=>{const b=e.target.closest('button');if(!b||b.disabled)return;try{if(b.dataset.step){go(+b.dataset.step);return;}if(b.dataset.preset){history();state.points=C.clone(C.presets[b.dataset.preset]);state.scaleWidth=30;state.source='合成样例';state.confirmed=false;tool='select';drawPoints=[];zoom=1;pan={x:0,y:0};invalidate();render();return;}if(b.dataset.tool){tool=b.dataset.tool;drawPoints=[];render();if(tool==='draw')toast('依次点击画布添加顶点，再点击首点附近闭合。');return;}if(b.dataset.mode){state.mode=b.dataset.mode;state.models=state.mode==='layout_only'?['Qwen3-4B','Qwen3-8B']:['SD1.5 + Canny','SDXL + Canny'];invalidate();render();return;}switch(b.dataset.action){case 'next':if(state.step===3)await freeze();else if(state.step===5)exportSession();else go(state.step+1);break;case 'prev':go(state.step-1);break;case 'fit':zoom=1;pan={x:0,y:0};render();break;case 'zoomIn':zoom=Math.min(3,zoom*1.25);render();break;case 'zoomOut':zoom=Math.max(.5,zoom/1.25);render();break;case 'undo':if(undo.length){redo.push(C.clone(state.points));state.points=undo.pop();state.confirmed=false;invalidate();render();}break;case 'redo':if(redo.length){undo.push(C.clone(state.points));state.points=redo.pop();state.confirmed=false;invalidate();render();}break;case 'openImport':$('#importDialog').showModal();break;case 'closeImport':$('#importDialog').close();break;case 'importText':try{const p=parseSVG($('#svgText').value);history();state.points=p;state.confirmed=false;state.source='用户导入的简单 SVG';zoom=1;pan={x:0,y:0};invalidate();$('#importDialog').close();render();toast('已按实际坐标载入。请重新填写建筑总宽并确认尺度。');}catch(x){$('#importError').textContent=x.message;}break;case 'api':toast('正式接口计划：POST /api/p1/v1/outlines/import。此离线原型没有 API 服务。');break;case 'allocate':{let p=state.params;if(!Number.isInteger(p.floorCount)||p.floorCount<1||p.floorCount>3||[p.desks,p.racks,p.rooms].some(x=>!Number.isInteger(x)||x<0)||p.rooms>30||p.racks>500||p.desks>500){toast('请使用范围内的非负整数，楼层限 1–3。');break;}p.rows=C.allocate(p);invalidate();render();toast('规则建议已分配，请核对；不代表空间可排入。');break;}case 'resetParams':state.params=defaultParams();invalidate();render();break;case 'exportSVG':download(engineeringSVG(),'image/svg+xml','P1_outline_engineering.svg');break;case 'exportPNG':{let s=engineeringSVG(),img=new Image(),url=URL.createObjectURL(new Blob([s],{type:'image/svg+xml'}));img.onload=()=>{let canvas=document.createElement('canvas');canvas.width=1400;canvas.height=1050;canvas.getContext('2d').drawImage(img,0,0,1400,1050);canvas.toBlob(blob=>{if(blob)download(blob,'image/png','P1_outline_engineering.png');URL.revokeObjectURL(url);},'image/png');};img.onerror=()=>{URL.revokeObjectURL(url);toast('PNG 导出失败，请先保存 SVG。');};img.src=url;break;}case 'traceNext':{let i=state.events.length-2;if(i<traceExamples.length){state.events.push({title:traceExamples[i][0],text:traceExamples[i][1],kind:'流程示例 · 未执行'});render();}else toast('已展开全部示例。真实模型、求解器与审批仍未接入。');break;}case 'favorite':state.favorite=!state.favorite;render();toast('只记录了体验偏好，不是正式设计批准。');break;case 'exportSession':exportSession();break;}}catch(x){toast(x.message);}});
function exportSession(){download(JSON.stringify({version:'0.3-ux',test_only:true,model_execution:false,approval:null,source:state.source,outline_svg_coordinates:state.points,width_m:state.scaleWidth,scale_confirmed_in_prototype:state.confirmed,program:state.params,snapshot:state.snapshot,events:state.events,prototype_favorite:state.favorite},null,2),'application/json','P1_prototype_session.json');}
document.addEventListener('change',e=>{let t=e.target;if(t.id==='scaleWidth'){let v=Number(t.value);if(!Number.isFinite(v)||v<1||v>500){toast('总宽需为 1–500 米之间的数值。');render();return;}state.scaleWidth=v;state.confirmed=false;invalidate();render();}else if(t.id==='scaleConfirmed'){state.confirmed=t.checked;invalidate();render();}else if(t.dataset.param){state.params[t.dataset.param]=t.value===''?null:Number(t.value);invalidate();render();}else if(t.dataset.row!==undefined){state.params.rows[+t.dataset.row][t.dataset.key]=t.value===''?null:Number(t.value);invalidate();render();}else if(t.dataset.model){state.models=state.models.filter(n=>n!==t.dataset.model);if(t.checked)state.models.push(t.dataset.model);invalidate();render();}else if(t.id==='seedCount'){state.seeds=+t.value;invalidate();render();}else if(t.id==='svgFile'){const f=t.files[0];if(f&&f.size<=256000)f.text().then(s=>$('#svgText').value=s);else $('#importError').textContent='文件过大（原型上限256KB）';}});
document.addEventListener('pointerdown',e=>{const svg=e.target.closest('#editor');if(!svg)return;let p=eventPoint(e);if(tool==='draw'){if(drawPoints.length>=3&&Math.hypot(p[0]-drawPoints[0][0],p[1]-drawPoints[0][1])<1){let err=C.validatePolygon(drawPoints);if(err){toast(err);return;}history();state.points=C.clone(drawPoints);state.confirmed=false;state.source='用户在原型绘制';drawPoints=[];tool='select';invalidate();render();}else{drawPoints.push(p);drawCanvas();}return;}if(tool==='pan'){drag={pan:true,start:p,old:{...pan},client:[e.clientX,e.clientY]};svg.setPointerCapture(e.pointerId);}else if(e.target.dataset.v!==undefined){history();drag={index:+e.target.dataset.v,old:C.clone(state.points)};svg.setPointerCapture(e.pointerId);}});
document.addEventListener('pointermove',e=>{if(!drag)return;if(drag.pan){let svg=$('#editor'),vb=svg.viewBox.baseVal,rect=svg.getBoundingClientRect(),s=Math.max(vb.width/rect.width,vb.height/rect.height);pan={x:drag.old.x-(e.clientX-drag.client[0])*s,y:drag.old.y-(e.clientY-drag.client[1])*s};drawCanvas();}else{let p=eventPoint(e);state.points[drag.index]=p;drawCanvas();}});
document.addEventListener('pointerup',()=>{if(!drag)return;if(!drag.pan){let err=C.validatePolygon(state.points);if(err){state.points=drag.old;undo.pop();toast(err+'，已恢复拖动前轮廓。');}else{state.confirmed=false;invalidate();}}drag=null;render();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&tool==='draw'){drawPoints=[];tool='select';render();toast('已退出绘制，保留原轮廓。');}});
window.P1Prototype={getState:()=>C.clone(state),parseSVG};render();
</script></body></html>
